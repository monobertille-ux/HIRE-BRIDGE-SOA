<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hire Bridge - Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #e2e8f0;
    }

    .card {
      display: flex;
      width: 900px;
      height: 580px;
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      position: relative;
    }

    /* --- PANNEAU GAUCHE --- */
    .left-panel {
      width: 42%;
      height: 100%;
      position: relative;
      background: #003a8c;
      overflow: hidden;
      color: white;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1;
    }

    /* Formes géométriques en arrière-plan */
    .bg-shape-1 {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 450px;
      height: 600px;
      background: #0050ac;
      transform: rotate(-35deg);
      z-index: -2;
    }

    .bg-shape-2 {
      position: absolute;
      bottom: -120px;
      left: -50px;
      width: 450px;
      height: 250px;
      background: #259b63;
      transform: rotate(-25deg);
      z-index: -1;
    }

    /* En-tête Mairie de Soa */
    .header-left {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-soa {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-soa-img {
      width: 45px;
      height: 45px;
      background: white;
      border-radius: 50%;
      padding: 2px;
      object-fit: contain;
    }

    .badge-text {
      font-size: 10px;
      font-weight: 700;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .badge-text span {
      font-size: 16px;
      font-weight: 800;
      display: block;
    }

    .app-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .app-title span {
      color: #259b63;
    }

    /* Texte milieu */
    .hero-content {
      margin-top: 80px;
    }

    .hero-content h2 {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 12px;
    }

    .green-line {
      width: 40px;
      height: 4px;
      background-color: #259b63;
      border-radius: 2px;
    }

    /* --- DECOUPE ARRONDI LOGIN (Style puzzle) --- */
    .login-notch {
      position: absolute;
      right: -2px;
      top: 30%;
      width: 140px;
      height: 65px;
      background-color: #ffffff;
      border-top-left-radius: 35px;
      border-bottom-left-radius: 35px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #003a8c;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.5px;
      z-index: 10;
    }

    /* --- PANNEAU DROIT --- */
    .right-panel {
      width: 58%;
      height: 100%;
      padding: 40px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
    }

    /* Avatar rond avec dégradé vert */
    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0050ac 0%, #259b63 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 38px;
      margin-bottom: 15px;
    }

    .title-connexion {
      color: #003a8c;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 30px;
    }

    form {
      width: 100%;
    }

    .input-box {
      position: relative;
      margin-bottom: 18px;
      width: 100%;
    }

    .input-box input {
      width: 100%;
      padding: 12px 42px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      color: #334155;
      outline: none;
      transition: border 0.2s;
    }

    .input-box input:focus {
      border-color: #259b63;
    }

    .input-box i.icon-left {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 15px;
    }

    .input-box i.icon-right {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      cursor: pointer;
      font-size: 15px;
    }

    .forgot-password {
      display: block;
      color: #259b63;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      margin-bottom: 22px;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background-color: #259b63;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: #1e7e50;
    }

    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 20px 0;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }

    .divider span {
      padding: 0 10px;
    }

    .btn-google {
      width: 100%;
      padding: 11px;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }

    .register-text {
      margin-top: 25px;
      font-size: 12px;
      color: #475569;
      font-weight: 500;
    }

    .register-text a {
      color: #259b63;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

<div class="card">
  <!-- PANNEAU GAUCHE -->
  <div class="left-panel">
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <div class="header-left">
      <div class="badge-soa">
        <img class="logo-soa-img" src="https://upload.wikimedia.org/wikipedia/commons/b/b5/Coat_of_arms_of_Cameroon.svg" alt="Logo Soa">
        <div class="badge-text">
          Mairie de
          <span>SOA</span>
        </div>
      </div>
      <div class="app-title">- HIRE <span>BRIDGE</span></div>
    </div>

    <div class="hero-content">
      <h2>Votre carrière<br>à la mairie<br>commence ici.</h2>
      <div class="green-line"></div>
    </div>

    <div></div>

    <!-- Bulle de découpe blanche pour LOGIN -->
    <div class="login-notch">LOGIN</div>
  </div>

  <!-- PANNEAU DROIT -->
  <div class="right-panel">
    <div class="avatar-circle">
      <i class="fa-regular fa-user"></i>
    </div>

    <h1 class="title-connexion">CONNEXION</h1>

    <form onsubmit="return false;">
      <div class="input-box">
        <i class="fa-regular fa-envelope icon-left"></i>
        <input type="email" placeholder="Email" required>
      </div>

      <div class="input-box">
        <i class="fa-solid fa-lock icon-left"></i>
        <input type="password" id="passwordInput" placeholder="Mot de passe" required>
        <i class="fa-regular fa-eye icon-right" onclick="togglePasswordVisibility()"></i>
      </div>

      <a href="#" class="forgot-password">Mot de passe oublié ?</a>

      <button type="submit" class="btn-submit">SE CONNECTER</button>
    </form>

    <div class="divider"><span>OU</span></div>

   <button class="btn-google">
      <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18" height="18" alt="Google">
      Se connecter avec Google
    </button>

    <p class="register-text">
      Pas encore de compte ? <a href="#">Créer un compte</a>
    </p>
  </div>
</div>

<script>
  function togglePasswordVisibility() {
    const passInput = document.getElementById('passwordInput');
    if (passInput.type === 'password') {
      passInput.type = 'text';
    } else {
      passInput.type = 'password';
    }
  }
</script>

</body>
</html>
